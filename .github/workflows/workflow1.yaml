name: Resuable Workflow

on:
  workflow_call:
    inputs:
      image_tag: 
        required: true
        default: latest 
        type: string 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ckeckout code
        uses: action/checkout@v4
      - name: building docker file
        run: docker build -t nginximage:${{github.event.inputs.image_tag}} .
